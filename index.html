<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tomas">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<meta name="app-version" content="2026-10-17-i">
<title>Tomas del bebé</title>
<style>
:root{--bg:#fdf6f0;--card:#fff;--tx:#2b2430;--mut:#7a707f;--ok:#2e9e6b;--no:#d9534f;--ac:#7b5ea7;--bd:#eadfd6}
@media (prefers-color-scheme:dark){:root{--bg:#17141b;--card:#241f2a;--tx:#f1ecf4;--mut:#a99fb0;--bd:#372f40}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:480px;margin:0 auto;padding:16px}
[hidden]{display:none!important}
.top{display:flex;justify-content:space-between;align-items:center}
h1{font-size:22px;margin:4px 0}
.gear{border:0;background:none;font-size:24px;padding:6px}
#st{color:var(--mut);font-size:13px;margin-bottom:10px;min-height:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font-size:15px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.add{display:flex;gap:8px;margin-bottom:8px}
input[type=text],input[type=password]{flex:1;width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 10px;font-size:15px}
button{font:inherit}
.add button,.bar button,.xb button,#tsave,#imp{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:9px 14px;font-size:15px;font-weight:600}
#db{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;font-size:14px}
.lnk{border:0;background:none;color:var(--mut);text-decoration:underline;font-size:14px;padding:2px 0}
.dng{border:0;background:var(--no);color:#fff;border-radius:8px;padding:6px 12px}
.row .dng+button,#db .dng+button{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;padding:6px 12px}
.timer{background:var(--card);border:1px solid var(--bd);border-radius:18px;text-align:center;padding:20px 12px;margin-bottom:14px}
.clock{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums}
.sub{color:var(--mut);font-size:14px;min-height:20px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.btns button{border:0;border-radius:16px;padding:22px 0;font-size:20px;font-weight:700;color:#fff}
#s{background:var(--ok)}#e{background:var(--no)}
.btns button:disabled{opacity:.3}
h2{font-size:16px;margin:0 0 8px;color:var(--mut)}
h3{font-size:15px;margin:14px 0 8px}
.bar{display:flex;gap:8px;margin-bottom:12px}
#fb{flex:1;text-align:left;background:var(--card)!important;color:var(--tx)!important;border:1px solid var(--bd)!important;font-weight:400!important}
#fp,#xp,#sp,#ef{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:12px}
#fp{max-height:260px;overflow-y:auto}
#fp label{display:flex;gap:10px;align-items:center;padding:7px 0}
#fp input{width:20px;height:20px}
.sep{color:var(--mut);font-size:13px;margin-top:8px;border-top:1px solid var(--bd);padding-top:8px}
#xt{width:100%;height:180px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:15px/1.4 ui-monospace,Menlo,monospace;padding:8px}
.xb{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
#wa{background:#25a244!important}
.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.row b{font-size:17px}.row small{color:var(--mut);display:block}
.row>button{border:0;background:none;color:var(--mut);font-size:18px;padding:6px}
.tabs,.seg{display:flex;gap:8px;margin-bottom:12px}
.tabs button,.seg button{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 4px;font-weight:600;font-size:15px}
.seg button{font-size:14px;font-weight:500}
.tabs .on,.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--mut);margin:4px 0 16px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.tw{overflow-x:auto;margin-bottom:16px}
table{border-collapse:collapse;font-size:14px;width:100%}
th,td{border-bottom:1px solid var(--bd);padding:6px 8px;text-align:center;white-space:nowrap}
th{color:var(--mut);font-weight:600}
th:first-child,td:first-child{position:sticky;left:0;background:var(--bg);text-align:left;font-weight:600}
.acts{display:flex}
.acts button{border:0;background:none;color:var(--mut);font-size:18px;padding:6px}
#ef label{display:block;font-size:14px;color:var(--mut);margin-top:8px}
#ef input{display:block;width:100%;min-height:42px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:9px;font-size:16px}
#ef .err{color:var(--no);font-size:14px;min-height:18px;margin-top:6px}
#ef .gh{background:none!important;color:var(--tx)!important;border:1px solid var(--bd)!important}
#wb{margin-top:-10px;margin-bottom:22px}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px}
.btns2 button{border:0;border-radius:14px;padding:14px 0;font-size:17px;font-weight:700;color:#fff}
#wk{background:#4f5fb3}#ws{background:#2f8f9d}
.btns2 button:disabled{opacity:.3}
#wl{margin-top:8px}
#wadd{margin-top:2px}
.pill{display:inline-flex;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:2px 4px 2px 10px;font-size:14px}
.pill button{border:0;background:none;color:var(--mut);font-size:15px;padding:4px 6px}
#wl .dng+button{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;padding:6px 12px}
#pb{margin-bottom:22px}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px}
#pk{border:0;border-radius:12px;padding:9px 16px;font-size:15px;font-weight:700;color:#fff;background:#a0724a;white-space:nowrap}
#pc{font-size:15px;font-weight:600}
#pk:disabled{opacity:.3}
#pl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px}
#pl .dng+button{border:1px solid var(--bd);background:none;color:var(--tx);border-radius:8px;padding:6px 12px}
</style>
</head>
<body>
<main>
<div class="top"><h1>🍼 Tomas</h1><div><button class="gear" id="rl" aria-label="Actualizar">🔄</button><button class="gear" id="gear" aria-label="Ajustes">⚙️</button></div></div>
<div id="st"></div>
<div id="sp" hidden>
 <b>Conexión con GitHub</b>
 <p class="sub" id="sm"></p>
 <input id="tk" type="password" placeholder="Pega aquí el token de GitHub" autocomplete="off">
 <div class="xb"><button id="tsave">Guardar token</button><button id="imp" hidden>Importar tomas de este dispositivo</button></div>
 <p class="sub">El token se guarda solo en este dispositivo. Sin token puedes ver el registro, pero no modificarlo.</p>
</div>
<div class="tabs"><button id="t1" class="on">Registro</button><button id="t2">Estadísticas</button></div>
<div class="chips" id="chips"></div>
<div id="v1">
<div class="add"><input type="text" id="nn" placeholder="Añadir bebé (nombre)"><button id="ab">Añadir</button></div>
<div id="db" hidden></div>
<div class="timer"><div class="clock" id="clk">00:00</div><div class="sub" id="sub"></div></div>
<div class="btns"><button id="s">▶ Inicio</button><button id="e">■ Fin</button></div>
<div id="wb"><div class="btns2"><button id="wk">🌙 Despertar</button><button id="ws">😴 Dormir</button></div><div class="sub" id="wc"></div><div id="wl"></div><button class="lnk" id="wadd">＋ Añadir despertar</button></div>
<div id="pb"><div class="prow"><div id="pc"></div><button id="pk">💩 Caca</button></div><div id="pl"></div></div>
<h2>Historial</h2>
<div class="bar"><button id="fb">Todos los días ▾</button><button id="ex">Exportar</button><button id="ad">＋ Toma</button></div>
<div id="fp" hidden></div>
<div id="xp" hidden><textarea id="xt" readonly></textarea><div class="xb"><button id="cp">Copiar</button><button id="wa">WhatsApp</button><span class="sub" id="xm"></span></div></div>
<div id="ef" hidden>
 <b id="eh">Añadir toma</b>
 <label><span id="l1">Inicio</span><input type="datetime-local" id="e1"></label>
 <label><span id="l2">Fin</span><input type="datetime-local" id="e2"></label>
 <div class="err" id="er"></div>
 <div class="xb"><button id="esv">Guardar</button><button id="ecn" class="gh">Cancelar</button><button id="eclr" class="gh" hidden>Sin hora de fin</button></div>
</div>
<div id="list"></div>
</div>
<div id="v2" hidden>
 <div class="seg" id="sg"></div>
 <h2>Minutos de cada toma por día</h2>
 <div id="ch"></div>
 <div class="lg" id="lg"></div>
 <h2>Despertares nocturnos por noche</h2>
 <div id="wch"></div>
 <h2>Minutos de cada toma</h2>
 <div class="tw"><table id="tm"></table></div>
 <h2>Hora de inicio de cada toma</h2>
 <div class="tw"><table id="th"></table></div>
</div>
</main>
<script>
// Repositorio y archivo donde se guarda el registro compartido
const REPO='gulpirri/toma-bebe-datos',FILE='tomas.json',BRANCH='main';
const API=`https://api.github.com/repos/${REPO}/contents/${FILE}`;
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const norm=d=>{d=d||{};return{babies:d.babies||[],feeds:d.feeds||[],active:d.active||{},wakes:d.wakes||[],poops:d.poops||[]};};
let S;try{S=norm(JSON.parse(ls.get('tomas-cache-v2')))}catch(e){S=norm()}
let sel=ls.get('tomas-sel')||null,TOKEN=ls.get('tomas-token')||'',busy=false,pend=null,delC=false,preset='all',FD=new Set();
const mk=(t,x,f,c)=>{const e=document.createElement(t);if(x)e.textContent=x;if(f)e.onclick=f;if(c)e.className=c;return e;};
const dur=ms=>{const t=Math.max(0,Math.round(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?`${h} h ${m} min`:`${m} min ${p2(s)} s`;};
const clock=ms=>{const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return(h?p2(h)+':':'')+p2(m)+':'+p2(s);};
const fd=t=>new Date(t).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
const ft=t=>new Date(t).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
const dl=t=>{const d=new Date(t);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+p2(d.getFullYear()%100);};
const mins=f=>Math.round((f.end-f.start)/60000);
const NIGHT_START=21,NIGHT_END=9; // la noche va de 21:00 a 09:00 y el día de registro empieza a las 09:00
const dy=t=>{const d=new Date(t);if(d.getHours()<NIGHT_END)d.setDate(d.getDate()-1);return d;};
const ck=t=>dk(dy(t).getTime()),cl=t=>dl(dy(t).getTime());
const nt=t=>{const h=new Date(t).getHours();return h>=NIGHT_START||h<NIGHT_END;};
const since=n=>{const c=dy(Date.now());c.setHours(NIGHT_END,0,0,0);c.setDate(c.getDate()-n);return c.getTime();};
const inF=f=>preset==='custom'?FD.has(ck(f.start)):preset==='3d'?f.start>=since(2):preset==='7d'?f.start>=since(6):true;
const setSt=t=>{$('st').textContent=t;};
const openSet=m=>{$('sm').textContent=m||'';$('sp').hidden=false;};

// ---- GitHub ----
const hdr=()=>{const h={Accept:'application/vnd.github+json'};if(TOKEN)h.Authorization='Bearer '+TOKEN;return h;};
const dec=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,''))));
const enc=s=>btoa(unescape(encodeURIComponent(s)));
async function pull(){
 const r=await fetch(`${API}?ref=${BRANCH}&t=${Date.now()}`,{headers:hdr(),cache:'no-store'});
 if(r.status===404){if(!TOKEN)throw new Error('Configura el token en ⚙️');return{data:norm(),sha:null};}
 if(!r.ok)throw new Error('GitHub '+r.status);
 const j=await r.json();return{data:norm(JSON.parse(dec(j.content))),sha:j.sha};
}
const push=(data,sha,msg)=>fetch(API,{method:'PUT',headers:hdr(),body:JSON.stringify({message:msg,content:enc(JSON.stringify(data)),branch:BRANCH,...(sha?{sha}:{})})});
async function mutate(fn,msg){
 if(!TOKEN){openSet('Para guardar cambios necesitas el token.');return false;}
 if(busy)return false;busy=true;setSt('Guardando…');
 try{
  for(let i=0;i<4;i++){
   const{data,sha}=await pull();fn(data);
   const r=await push(data,sha,msg);
   if(r.ok){S=data;ls.set('tomas-cache-v2',JSON.stringify(S));setSt('Sincronizado '+ft(Date.now()));return true;}
   if(r.status!==409&&r.status!==422)throw new Error('GitHub '+r.status+([401,403,404].includes(r.status)?' (revisa el token)':''));
  }
  throw new Error('Conflicto, inténtalo de nuevo');
 }catch(e){setSt('⚠ '+e.message);return false;}
 finally{busy=false;render();}
}
async function sync(){
 if(busy)return;
 try{const{data}=await pull();S=data;ls.set('tomas-cache-v2',JSON.stringify(S));setSt('Sincronizado '+ft(Date.now()));}
 catch(e){setSt('⚠ '+e.message+' · mostrando datos guardados');}
 render();
}

// ---- Exportar ----
function exportText(){
 if(!sel)return '';
 const fs=S.feeds.filter(f=>f.baby===sel&&inF(f)).sort((a,b)=>a.start-b.start);
 const days={};fs.forEach(f=>(days[ck(f.start)]=days[ck(f.start)]||[]).push(f));
 const nm=S.babies.find(b=>b.id===sel).name;
 return nm+'\n\n'+Object.keys(days).sort().map(k=>cl(days[k][0].start)+'\n'+days[k].map((f,i)=>`Toma ${i+1}; ${ft(f.start)} - ${ft(f.end)}; ${mins(f)} min`).join('\n')).join('\n\n');
}

// ---- Pantalla ----
function render(){
 if(!S.babies.find(b=>b.id===sel))sel=S.babies[0]?S.babies[0].id:null;
 ls.set('tomas-sel',sel||'');
 const ch=$('chips');ch.innerHTML='';
 S.babies.forEach(b=>{const c=mk('button',b.name+(S.active[b.id]?' ●':''),()=>{sel=b.id;pend=null;delC=false;render();},'chip'+(b.id===sel?' on':''));ch.appendChild(c);});
 const a=sel&&S.active[sel];
 $('s').disabled=!sel||!!a;$('e').disabled=!a;$('ad').disabled=!sel;$('wadd').disabled=!sel;
 const op=S.wakes.find(w=>w.baby===sel&&w.e===null);
 $('wk').disabled=!sel||!!op;$('ws').disabled=!op;
 wcText();
 const WL=$('wl');WL.innerHTML='';
 S.wakes.filter(w=>w.baby===sel&&(w.e===null||w.t>=Date.now()-864e5)).sort((x,y)=>y.t-x.t).forEach(w=>{
  const r=mk('div',null,null,'row');
  if(wpend===w.id)r.append(mk('span','¿Borrar este despertar?'),
   mk('button','Borrar',()=>{wpend=null;mutate(d=>{d.wakes=d.wakes.filter(x=>x.id!==w.id);},'Borrar despertar');},'dng'),
   mk('button','No',()=>{wpend=null;render();}));
  else{const i=document.createElement('div');
   i.innerHTML=w.e===null?`<b>En curso</b><small>🌙 ${ft(w.t)} →</small>`:w.e?`<b>${dur(w.e-w.t)}</b><small>🌙 ${ft(w.t)} → ${ft(w.e)}</small>`:`<b>${ft(w.t)}</b><small>🌙 despertar</small>`;
   const ac=mk('div',null,null,'acts'),be=mk('button','✎',()=>openEf(w,'wake')),bx=mk('button','✕',()=>{wpend=w.id;render();});
   be.setAttribute('aria-label','Editar');bx.setAttribute('aria-label','Borrar');ac.append(be,bx);r.append(i,ac);}
  WL.appendChild(r);});
 $('pk').disabled=!sel;
 const PL=$('pl');PL.innerHTML='';
 const rp=S.poops.filter(x=>x.baby===sel&&x.t>=Date.now()-864e5).sort((x,y)=>y.t-x.t);
 const lp=S.poops.filter(x=>x.baby===sel).reduce((m,x)=>Math.max(m,x.t),0);
 const nd=lp?Math.round((new Date().setHours(0,0,0,0)-new Date(lp).setHours(0,0,0,0))/864e5):0;
 $('pc').textContent=!sel?'':!lp?'Sin registros':nd===0?'Hoy ya hizo ✓':nd===1?'1 día sin caca':`${nd} días sin caca`;
 rp.forEach(x=>{
  if(ppend===x.id)PL.append(mk('span',`¿Borrar ${ft(x.t)}?`),
   mk('button','Borrar',()=>{ppend=null;mutate(d=>{d.poops=d.poops.filter(y=>y.id!==x.id);},'Borrar caca');},'dng'),
   mk('button','No',()=>{ppend=null;render();}));
  else{const pl=mk('span',null,null,'pill'),bx=mk('button','✕',()=>{ppend=x.id;render();});bx.setAttribute('aria-label','Borrar');pl.append('💩 '+ft(x.t)+' ',bx);PL.append(pl);}});
 $('sub').textContent=!sel?'Añade un bebé para empezar':a?`Inicio: ${fd(a)} ${ft(a)}`:'Listo para empezar';
 const D=$('db');D.innerHTML='';D.hidden=!sel;
 if(sel){const id=sel,nm=S.babies.find(b=>b.id===id).name;
  if(delC)D.append(mk('span',`¿Eliminar a ${nm} y todas sus tomas?`),
   mk('button','Sí, eliminar',()=>{delC=false;mutate(d=>{d.babies=d.babies.filter(b=>b.id!==id);d.feeds=d.feeds.filter(f=>f.baby!==id);d.wakes=d.wakes.filter(w=>w.baby!==id);d.poops=d.poops.filter(x=>x.baby!==id);delete d.active[id];},'Eliminar bebé');},'dng'),
   mk('button','Cancelar',()=>{delC=false;render();}));
  else D.append(mk('button','Eliminar este bebé',()=>{delC=true;render();},'lnk'));}
 tick();
 // lista y filtro
 const fs=S.feeds.filter(f=>f.baby===sel).sort((x,y)=>y.start-x.start);
 const keys=[...new Set(fs.map(f=>ck(f.start)))];
 FD=new Set([...FD].filter(k=>keys.includes(k)));
 if(preset==='custom'&&!FD.size)preset='all';
 $('fb').textContent=(preset==='3d'?'Últimos 3 días':preset==='7d'?'Última semana':preset==='custom'?FD.size+(FD.size===1?' día':' días'):'Todos los días')+' ▾';
 const P=$('fp');P.innerHTML='';
 const row=(type,checked,txt,fn)=>{const l=document.createElement('label'),i=document.createElement('input');i.type=type;i.checked=checked;i.onchange=fn;l.append(i,' '+txt);P.appendChild(l);};
 [['all','Todos los días'],['3d','Últimos 3 días'],['7d','Última semana']].forEach(([k,t])=>row('radio',preset===k,t,()=>{preset=k;FD=new Set();$('xp').hidden=true;render();}));
 if(keys.length)P.appendChild(mk('div','Elegir días',null,'sep'));
 keys.forEach(k=>row('checkbox',preset==='custom'&&FD.has(k),dl(new Date(k+'T12:00').getTime()),e=>{
  if(preset!=='custom'){preset='custom';FD=new Set();}
  e.target.checked?FD.add(k):FD.delete(k);
  if(!FD.size)preset='all';
  $('xp').hidden=true;render();}));
 const L=$('list');L.innerHTML='';
 const shown=fs.filter(inF);
 if(!shown.length)L.appendChild(mk('div','Sin tomas en este filtro.',null,'sub'));
 let last='';
 shown.forEach(f=>{const k=ck(f.start);
  if(k!==last){last=k;const n=shown.filter(x=>ck(x.start)===k);L.appendChild(mk('h3',`${cl(f.start)} · ${n.length} ${n.length===1?'toma':'tomas'} · ${dur(n.reduce((s,x)=>s+x.end-x.start,0))}`));}
  const r=mk('div',null,null,'row');
  if(pend===f.id)r.append(mk('span','¿Borrar esta toma?'),
   mk('button','Borrar',()=>{pend=null;mutate(d=>{d.feeds=d.feeds.filter(x=>x.id!==f.id);},'Borrar toma');},'dng'),
   mk('button','No',()=>{pend=null;render();}));
  else{const i=document.createElement('div');
   i.innerHTML=`<b>${dur(f.end-f.start)}</b><small>${nt(f.start)?'🌙 ':''}${ft(f.start)} → ${ft(f.end)}${dk(f.start)!==dk(f.end)?' ('+dl(f.end)+')':''}</small>`;
   const ac=mk('div',null,null,'acts'),be=mk('button','✎',()=>openEf(f)),bx=mk('button','✕',()=>{pend=f.id;render();});be.setAttribute('aria-label','Editar');bx.setAttribute('aria-label','Borrar');ac.append(be,bx);r.append(i,ac);}
  L.appendChild(r);});
 if(!$('v2').hidden)stats();
}
function wcText(){const op=sel&&S.wakes.find(w=>w.baby===sel&&w.e===null);
 if(op)$('wc').textContent=`Despierto desde las ${ft(op.t)} · ${clock(Date.now()-op.t)}`;
 else{const n=sel?S.wakes.filter(w=>w.baby===sel&&w.t>=Date.now()-864e5).length:0;$('wc').textContent=sel?(n?`Despertares (últimas 24 h): ${n}`:'Sin despertares en las últimas 24 h'):'';}}
function tick(){const a=sel&&S.active[sel];$('clk').textContent=a?clock(Date.now()-a):'00:00';wcText();}

// ---- Estadísticas ----
const COL=['#7b5ea7','#2e9e6b','#e8a33d','#d9534f','#3b82c4','#c25ea0','#6b7a8f','#8a6d3b'];
let NR=7;
function stats(){
 const sg=$('sg');sg.innerHTML='';
 [[3,'3 días'],[7,'Semana'],[15,'15 días'],[30,'Mes']].forEach(([n,t])=>sg.appendChild(mk('button',t,()=>{NR=n;render();},n===NR?'on':'')));
 const by={};
 S.feeds.filter(f=>f.baby===sel&&f.start>=since(NR-1)).sort((a,b)=>a.start-b.start).forEach(f=>(by[ck(f.start)]=by[ck(f.start)]||[]).push(f));
 const days=[];
 for(let i=NR-1;i>=0;i--){const d=dy(Date.now());d.setHours(12,0,0,0);d.setDate(d.getDate()-i);days.push({t:d.getTime(),fs:by[dk(d.getTime())]||[]});}
 wakeChart(days);
 const mx=Math.max(0,...days.map(d=>d.fs.length));
 const tot=days.map(d=>d.fs.reduce((s,f)=>s+(f.end-f.start)/60000,0));
 if(!mx){$('ch').innerHTML='<div class="sub">Sin tomas en este periodo.</div>';$('lg').innerHTML='';$('tm').innerHTML='';$('th').innerHTML='';return;}
 const W=360,H=230,L=34,R=12,T=14,B=28,pw=W-L-R,ph=H-T-B;
 const mn=f=>(f.end-f.start)/60000,m=Math.max(...days.flatMap(d=>d.fs.map(mn)));
 const st=m<=30?10:m<=100?20:m<=300?50:100,top=Math.ceil(m/st)*st||st;
 const y=v=>T+ph*(1-v/top),slot=pw/NR,cx=i=>L+slot*i+slot/2,ev=Math.ceil(NR/7);
 let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="color:var(--mut);display:block" font-size="10" fill="currentColor">`;
 for(let v=0;v<=top;v+=st)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--bd)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
 days.forEach((d,i)=>{if((NR-1-i)%ev===0)g+=`<text x="${cx(i)}" y="${H-B+14}" text-anchor="middle">${dl(d.t).slice(0,5)}</text>`;});
 for(let j=0;j<mx;j++){
  const c=COL[j%COL.length];let path='',pen=false,dots='';
  days.forEach((d,i)=>{const f=d.fs[j];
   if(!f){pen=false;return;}
   const px=cx(i),py=y(mn(f));
   path+=(pen?'L':'M')+px.toFixed(1)+' '+py.toFixed(1);pen=true;
   dots+=`<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="${NR<=15?3.5:2.5}" fill="${c}"><title>${dl(d.t)} · Toma ${j+1}: ${Math.round(mn(f))} min</title></circle>`;});
  g+=`<path d="${path}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
 }
 $('ch').innerHTML=g+'</svg>';
 $('lg').innerHTML=Array.from({length:mx},(_,j)=>`<span><i style="background:${COL[j%COL.length]}"></i>Toma ${j+1}</span>`).join('');
 const rows=days.filter(d=>d.fs.length);
 const tb=(el,cell,tot)=>{el.innerHTML='<tr><th>Día</th>'+Array.from({length:mx},(_,j)=>`<th>Toma ${j+1}</th>`).join('')+(tot?'<th>Total</th>':'')+'</tr>'+
  rows.map(d=>`<tr><td>${dl(d.t)}</td>`+Array.from({length:mx},(_,j)=>`<td>${d.fs[j]?cell(d.fs[j]):'–'}</td>`).join('')+(tot?`<td><b>${tot(d)}</b></td>`:'')+'</tr>').join('');};
 tb($('tm'),f=>mins(f),d=>d.fs.reduce((s,f)=>s+mins(f),0));tb($('th'),f=>(nt(f.start)?'🌙 ':'')+ft(f.start));
}
const tab=n=>{$('v1').hidden=n!==1;$('v2').hidden=n!==2;$('t1').className=n===1?'on':'';$('t2').className=n===2?'on':'';if(n===2)stats();};
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);

// ---- Despertares nocturnos ----
let wpend=null,ppend=null;
function wakeChart(days){
 const by={};
 S.wakes.filter(w=>w.baby===sel&&w.t>=since(NR-1)).forEach(w=>{const k=ck(w.t);by[k]=(by[k]||0)+1;});
 const cnt=days.map(d=>by[dk(d.t)]||0),m=Math.max(0,...cnt);
 if(!m){$('wch').innerHTML='<div class="sub">Sin despertares en este periodo.</div>';return;}
 const W=360,H=200,L=30,R=8,T=16,B=28,pw=W-L-R,ph=H-T-B,st=m<=5?1:Math.ceil(m/5),top=Math.ceil(m/st)*st;
 const y=v=>T+ph*(1-v/top),slot=pw/NR,bw=slot*0.85,ev=Math.ceil(NR/7);
 let g=`<svg viewBox="0 0 ${W} ${H}" width="100%" style="color:var(--mut);display:block" font-size="10" fill="currentColor">`;
 for(let v=0;v<=top;v+=st)g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--bd)"/><text x="${L-4}" y="${y(v)+3}" text-anchor="end">${v}</text>`;
 days.forEach((d,i)=>{const x=L+slot*i+(slot-bw)/2;
  if(cnt[i])g+=`<rect x="${x}" y="${y(cnt[i])}" width="${bw}" height="${ph*cnt[i]/top}" fill="#4f5fb3"><title>${dl(d.t)}: ${cnt[i]} despertares</title></rect>`+(NR<=15?`<text x="${x+bw/2}" y="${y(cnt[i])-3}" text-anchor="middle" style="fill:var(--tx)">${cnt[i]}</text>`:'');
  if((NR-1-i)%ev===0)g+=`<text x="${x+bw/2}" y="${H-B+14}" text-anchor="middle">${dl(d.t).slice(0,5)}</text>`;});
 $('wch').innerHTML=g+'</svg>';
}
$('wk').onclick=()=>{const id=sel,t=Date.now();mutate(d=>{if(!d.wakes.some(w=>w.baby===id&&w.e===null))d.wakes.push({id:'w'+t+Math.random().toString(36).slice(2,5),baby:id,t,e:null});},'Despertar');};
$('ws').onclick=()=>{const id=sel,t=Date.now();mutate(d=>{const w=d.wakes.filter(x=>x.baby===id&&x.e===null).sort((x,y)=>y.t-x.t)[0];if(w)w.e=t;},'Dormir');};

$('pk').onclick=()=>{const id=sel,t=Date.now();mutate(d=>{d.poops.push({id:'p'+t+Math.random().toString(36).slice(2,5),baby:id,t});},'Caca');};

// ---- Editar / añadir tomas ----
let editId=null,efKind='feed';
const lv=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+'T'+p2(d.getHours())+':'+p2(d.getMinutes());};
function openEf(f,kind){efKind=kind||'feed';editId=f?f.id:null;const n=Date.now(),w=efKind==='wake';
 $('eh').textContent=(f?'Editar ':'Añadir ')+(w?'despertar':'toma');
 $('l1').textContent=w?'Despertó a las':'Inicio';$('l2').textContent=w?'Volvió a dormir (opcional)':'Fin';
 $('e1').value=lv(f?(w?f.t:f.start):n-(w?10:20)*6e4);
 $('e2').value=f?(w?(f.e?lv(f.e):''):lv(f.end)):lv(n);
 $('eclr').hidden=!w;$('er').textContent='';$('ef').hidden=false;$('ef').scrollIntoView({behavior:'smooth',block:'center'});}
$('ad').onclick=()=>openEf(null,'feed');
$('wadd').onclick=()=>openEf(null,'wake');
$('eclr').onclick=()=>{$('e2').value='';};
$('ecn').onclick=()=>{$('ef').hidden=true;};
$('esv').onclick=async()=>{const w=efKind==='wake';
 const a=new Date($('e1').value).getTime(),hasB=!!$('e2').value,b=hasB?new Date($('e2').value).getTime():null;
 if(!$('e1').value||isNaN(a)||(!w&&!hasB)||(hasB&&isNaN(b))){$('er').textContent=w?'Indica cuándo despertó.':'Rellena inicio y fin.';return;}
 if(hasB&&b<=a){$('er').textContent=(w?'Volver a dormir':'El fin')+' debe ser posterior al inicio.';return;}
 if(a>Date.now()+6e4||(hasB&&b>Date.now()+6e4)){$('er').textContent='La hora no puede estar en el futuro.';return;}
 const id=sel,eid=editId;
 const ok=await mutate(d=>{
  if(w){const x=eid&&d.wakes.find(y=>y.id===eid);
   if(x){x.t=a;if(!(b===null&&x.e===undefined))x.e=b;}else d.wakes.push({id:eid||'w'+a+Math.random().toString(36).slice(2,5),baby:id,t:a,e:b});}
  else{const f=eid&&d.feeds.find(x=>x.id===eid);
   if(f){f.start=a;f.end=b;}else d.feeds.push({id:eid||'f'+a+Math.random().toString(36).slice(2,5),baby:id,start:a,end:b});}},
  (eid?'Editar ':'Añadir ')+(w?'despertar':'toma'));
 if(ok)$('ef').hidden=true;};

// ---- Eventos ----
$('s').onclick=()=>{const id=sel;mutate(d=>{if(!d.active[id])d.active[id]=Date.now();},'Inicio toma');};
$('e').onclick=()=>{const id=sel,end=Date.now();mutate(d=>{const a=d.active[id];if(!a)return;d.feeds.push({id:'f'+end+Math.random().toString(36).slice(2,5),baby:id,start:a,end});delete d.active[id];},'Fin toma');};
$('ab').onclick=async()=>{const n=$('nn').value.trim();if(!n)return;const id='b'+Date.now();
 if(await mutate(d=>{d.babies.push({id,name:n});},'Añadir bebé')){sel=id;$('nn').value='';render();}};
$('fb').onclick=()=>{$('fp').hidden=!$('fp').hidden;};
$('ex').onclick=()=>{$('xt').value=exportText();$('xm').textContent='';$('xp').hidden=false;};
$('cp').onclick=async()=>{const t=$('xt');let ok=false;
 try{await navigator.clipboard.writeText(t.value);ok=true;}catch(e){}
 if(!ok){try{t.removeAttribute('readonly');t.select();t.setSelectionRange(0,99999);ok=document.execCommand('copy');t.setAttribute('readonly','');}catch(e){}}
 $('xm').textContent=ok?'¡Copiado!':'Mantén pulsado el texto para copiar';};
$('wa').onclick=()=>{window.open('https://wa.me/?text='+encodeURIComponent($('xt').value),'_blank');};
$('rl').onclick=()=>{location.href=location.pathname+'?v='+Date.now();};
$('gear').onclick=()=>{$('sp').hidden=!$('sp').hidden;$('sm').textContent=TOKEN?'Token guardado en este dispositivo.':'Todavía no hay token.';};
$('tsave').onclick=async()=>{TOKEN=$('tk').value.trim();ls.set('tomas-token',TOKEN);$('tk').value='';
 $('sm').textContent=TOKEN?'Token guardado. Comprobando…':'Token borrado.';await sync();
 $('sm').textContent=$('st').textContent.startsWith('⚠')?$('st').textContent:'Conectado correctamente.';};
// Importar tomas guardadas en la versión anterior (solo en este dispositivo)
let old=null;try{old=JSON.parse(ls.get('tomas-bebe-v1'));}catch(e){}
if(old&&((old.feeds||[]).length||(old.babies||[]).length)){$('imp').hidden=false;
 $('imp').onclick=async()=>{const ok=await mutate(d=>{
  (old.babies||[]).forEach(b=>{if(!d.babies.find(x=>x.id===b.id))d.babies.push({id:b.id,name:b.name});});
  (old.feeds||[]).forEach(f=>{if(!d.feeds.find(x=>x.id===f.id))d.feeds.push({id:f.id,baby:f.baby,start:f.start,end:f.end});});
  Object.entries(old.active||{}).forEach(([k,v])=>{if(!d.active[k])d.active[k]=v;});},'Importar datos antiguos');
  if(ok){ls.del('tomas-bebe-v1');$('imp').hidden=true;$('sm').textContent='Importado.';}};}
setInterval(tick,1000);setInterval(sync,30000);
// Si el icono de inicio tiene guardada una versión vieja de la página, se recarga sola
async function checkVer(){
 try{const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}),t=await r.text(),m=t.match(/app-version" content="([^"]+)"/);
  if(m&&m[1]!==document.querySelector('meta[name=app-version]').content)location.replace(location.pathname+'?v='+Date.now());}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkVer();sync();}});
window.addEventListener('pageshow',sync);window.addEventListener('online',sync);
render();checkVer();
sync().then(()=>{if($('st').textContent.startsWith('⚠'))setTimeout(sync,3000);});
</script>
</body>
