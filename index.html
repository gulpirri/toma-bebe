<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tomas del bebé</title>
<style>
:root{--bg:#fdf6f0;--card:#fff;--tx:#2b2430;--mut:#7a707f;--ok:#2e9e6b;--no:#d9534f;--ac:#7b5ea7;--bd:#eadfd6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141b;--card:#241f2a;--tx:#f1ecf4;--mut:#a99fb0;--bd:#372f40}}
:root[data-theme="dark"]{--bg:#17141b;--card:#241f2a;--tx:#f1ecf4;--mut:#a99fb0;--bd:#372f40}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font-size:15px}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.add{display:flex;gap:8px;margin-bottom:16px}
.add input{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 10px;font-size:15px}
.add button{border:0;background:var(--bd);color:var(--tx);border-radius:10px;padding:8px 12px;font-size:15px}
.timer{background:var(--card);border:1px solid var(--bd);border-radius:18px;text-align:center;padding:20px 12px;margin-bottom:14px}
.clock{font-size:46px;font-weight:700;font-variant-numeric:tabular-nums}
.sub{color:var(--mut);font-size:14px;min-height:20px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:22px}
.btns button{border:0;border-radius:16px;padding:22px 0;font-size:20px;font-weight:700;color:#fff}
#s{background:var(--ok)}#e{background:var(--no)}
.btns button:disabled{opacity:.3}
h2{font-size:16px;margin:0 0 8px;color:var(--mut)}
.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.row b{font-size:17px}.row small{color:var(--mut);display:block}
.row button{border:0;background:none;color:var(--mut);font-size:18px;padding:6px}
[hidden]{display:none!important}
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar select{flex:1;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:9px 10px;font-size:15px}
.bar button,.xb button{border:0;background:var(--ac);color:#fff;border-radius:10px;padding:9px 14px;font-size:15px;font-weight:600}
#xp{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:12px}
#xt{width:100%;height:180px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:15px/1.4 ui-monospace,Menlo,monospace;padding:8px}
.xb{display:flex;gap:8px;margin-top:8px;align-items:center}
#wa{background:#25a244!important}
h3{font-size:15px;margin:14px 0 8px}
#fb{flex:1;text-align:left;background:var(--card)!important;color:var(--tx)!important;border:1px solid var(--bd)!important;font-weight:400!important}
#fp{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:4px 12px;margin-bottom:12px;max-height:220px;overflow-y:auto}
#fp label{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:16px}
#fp input{width:20px;height:20px}
</style>
</head>
<body>
<main>
<h1>🍼 Tomas</h1>
<div class="chips" id="chips"></div>
<div class="add"><input id="nn" placeholder="Añadir bebé (nombre)"><button id="ab">Añadir</button></div>
<div class="timer"><div class="clock" id="clk">00:00</div><div class="sub" id="sub"></div></div>
<div class="btns"><button id="s">▶ Inicio</button><button id="e">■ Fin</button></div>
<h2>Historial</h2>
<div class="bar"><button id="fb">Todos los días ▾</button><button id="ex">Exportar</button></div>
<div id="fp" hidden></div>
<div id="xp" hidden><textarea id="xt" readonly></textarea><div class="xb"><button id="cp">Copiar</button><button id="wa">WhatsApp</button><span class="sub" id="xm"></span></div></div>
<div id="list"></div>
</main>
<script>
const KEY='tomas-bebe-v1';
let S={babies:[{id:'b1',name:'Bebé'}],feeds:[],active:{},sel:'b1'};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const $=id=>document.getElementById(id);
const p2=n=>String(n).padStart(2,'0');
function dur(ms){const t=Math.max(0,Math.round(ms/1000)),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
 return h?`${h} h ${m} min`:`${m} min ${p2(s)} s`;}
function clock(ms){const t=Math.floor(ms/1000),h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;
 return (h?p2(h)+':':'')+p2(m)+':'+p2(s);}
const fd=t=>new Date(t).toLocaleDateString('es-ES',{day:'2-digit',month:'short',year:'numeric'});
const ft=t=>new Date(t).toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'});
let FD=new Set();
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());};
const dl=t=>{const d=new Date(t);return p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+p2(d.getFullYear()%100);};
const mins=f=>Math.round((f.end-f.start)/60000);
function exportText(){
 const fs=S.feeds.filter(f=>f.baby===S.sel&&(!FD.size||FD.has(dk(f.start)))).sort((a,b)=>a.start-b.start);
 const days={};fs.forEach(f=>(days[dk(f.start)]=days[dk(f.start)]||[]).push(f));
 const nm=S.babies.find(b=>b.id===S.sel).name;
 return nm+'\n\n'+Object.keys(days).sort().map(k=>dl(days[k][0].start)+'\n'+days[k].map((f,i)=>`Toma ${i+1}; ${ft(f.start)} - ${ft(f.end)}; ${mins(f)} min`).join('\n')).join('\n\n');
}
function render(){
 $('chips').innerHTML='';
 S.babies.forEach(b=>{const c=document.createElement('button');c.className='chip'+(b.id===S.sel?' on':'');
  c.textContent=b.name+(S.active[b.id]?' ●':'');c.onclick=()=>{S.sel=b.id;save();render();};$('chips').appendChild(c);});
 const a=S.active[S.sel];
 $('s').disabled=!!a;$('e').disabled=!a;
 $('sub').textContent=a?`Inicio: ${fd(a)} ${ft(a)}`:'Listo para empezar';
 tick();
 const fs=S.feeds.filter(f=>f.baby===S.sel).sort((x,y)=>y.start-x.start);
 const keys=[...new Set(fs.map(f=>dk(f.start)))];
 FD=new Set([...FD].filter(k=>keys.includes(k)));
 $('fb').textContent=(FD.size?FD.size+(FD.size===1?' día':' días'):'Todos los días')+' ▾';
 const P=$('fp');P.innerHTML='';
 const all=document.createElement('label');all.innerHTML=`<input type="checkbox" ${FD.size?'':'checked'}> Todos los días`;
 all.firstChild.onchange=()=>{FD=new Set();$('xp').hidden=true;render();};P.appendChild(all);
 keys.forEach(k=>{const l=document.createElement('label');l.innerHTML=`<input type="checkbox" ${FD.has(k)?'checked':''}> ${dl(new Date(k+'T12:00').getTime())}`;
  l.firstChild.onchange=e=>{e.target.checked?FD.add(k):FD.delete(k);$('xp').hidden=true;render();};P.appendChild(l);});
 const L=$('list');L.innerHTML='';
 const shown=fs.filter(f=>!FD.size||FD.has(dk(f.start)));
 if(!shown.length)L.innerHTML='<div class="sub">Aún no hay tomas.</div>';
 let last='';
 shown.forEach(f=>{const k=dk(f.start);
  if(k!==last){last=k;const n=shown.filter(x=>dk(x.start)===k);const h=document.createElement('h3');h.textContent=`${dl(f.start)} · ${n.length} ${n.length===1?'toma':'tomas'} · ${dur(n.reduce((s,x)=>s+x.end-x.start,0))}`;L.appendChild(h);}
  const r=document.createElement('div');r.className='row';
  r.innerHTML=`<div><b>${dur(f.end-f.start)}</b><small>${ft(f.start)} → ${ft(f.end)}${dk(f.start)!==dk(f.end)?' ('+dl(f.end)+')':''}</small></div>`;
  const d=document.createElement('button');d.textContent='✕';d.setAttribute('aria-label','Borrar');
  d.onclick=()=>{S.feeds=S.feeds.filter(x=>x.id!==f.id);save();render();};r.appendChild(d);L.appendChild(r);});
}
function tick(){const a=S.active[S.sel];$('clk').textContent=a?clock(Date.now()-a):'00:00';}
$('s').onclick=()=>{S.active[S.sel]=Date.now();save();render();};
$('e').onclick=()=>{const a=S.active[S.sel];if(!a)return;
 S.feeds.push({id:'f'+Date.now(),baby:S.sel,start:a,end:Date.now()});delete S.active[S.sel];save();render();};
$('ab').onclick=()=>{const n=$('nn').value.trim();if(!n)return;
 const id='b'+Date.now();S.babies.push({id,name:n});S.sel=id;$('nn').value='';save();render();};
$('fb').onclick=()=>{$('fp').hidden=!$('fp').hidden;};
$('ex').onclick=()=>{$('xt').value=exportText();$('xm').textContent='';$('xp').hidden=false;};
$('cp').onclick=async()=>{const t=$('xt');let ok=false;
 try{await navigator.clipboard.writeText(t.value);ok=true;}catch(e){}
 if(!ok){try{t.removeAttribute('readonly');t.select();t.setSelectionRange(0,99999);ok=document.execCommand('copy');t.setAttribute('readonly','');}catch(e){}}
 $('xm').textContent=ok?'¡Copiado!':'Mantén pulsado el texto para copiar';};
$('wa').onclick=()=>{window.open('https://wa.me/?text='+encodeURIComponent($('xt').value),'_blank');};
setInterval(tick,1000);render();
</script>
</body>
</html>
